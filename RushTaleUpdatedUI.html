const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let muted = false;

function playTone(freq, endFreq, duration, type = 'square', vol = 0.12) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

  const saved = JSON.parse(localStorage.getItem('rushtale_save') || '{}');
  if (typeof saved.unlocked === 'number') unlockedLevel = Math.min(LEVELS.length - 1, saved.unlocked);
  if (saved.bestTimes) bestTimes = saved.bestTimes;
  if (saved.bestCoins) bestCoins = saved.bestCoins;
} catch (e) {}

function saveProgress() {
  try {
    localStorage.setItem('rushtale_save', JSON.stringify({
      unlocked: unlockedLevel,
      bestTimes,
      bestCoins
    }));
  } catch (e) {}
}

// ---- Global State ----

let levelSelectPage = 0;

let platforms = [];

let particles = [];

let levelTime = 0;

let deaths = 0;

// ---- Input ----
const keys = {};
const left  = () => keys.ArrowLeft  || keys.KeyA;
const right = () => keys.ArrowRight || keys.KeyD;
const jumpHeld = () => keys.ArrowUp || keys.KeyW || keys.Space;

addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  const isNewPress = !keys[e.code];
  keys[e.code] = true;
  if (isNewPress) onPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });

function onPress(code) {
  const confirm = code === 'Enter' || code === 'Space';
  if (code === 'KeyM') { muted = !muted; return; }
  if (code === 'KeyC') { crtEnabled = !crtEnabled; return; }

  if (screen === 'menu') {
    if (confirm) { sfx.click(); startLevel(unlockedLevel); }
  } else if (screen === 'select') {
    if (code === 'ArrowLeft' || code === 'KeyA') {
      sfx.click();
      selected = (selected + CHARACTERS.length - 1) % CHARACTERS.length;
    }
    if (code === 'ArrowRight' || code === 'KeyD') {
      sfx.click();
      selected = (selected + 1) % CHARACTERS.length;
    }
    if (confirm || code === 'Escape') { sfx.click(); setScreen('menu'); }
  } else if (screen === 'levels') {
    if (code === 'Escape') { sfx.click(); setScreen('menu'); }
  } else if (screen === 'play') {
    if (code === 'Escape') { sfx.click(); setScreen('menu'); }
    if (code === 'KeyR') { respawnPlayer(false); }
    if (code === 'ArrowUp' || code === 'KeyW' || code === 'Space') {
      tryJump();
    }
  } else if (screen === 'win') {
    if (confirm) {
      sfx.click();
      if (currentLevelIdx + 1 < LEVELS.length) startLevel(currentLevelIdx + 1);
      else setScreen('levels');
    }
    if (code === 'Escape') { sfx.click(); setScreen('levels'); }
  }
}

function mousePos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inside = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

canvas.addEventListener('mousemove', e => {
  const p = mousePos(e);
  hovered = buttons.find(b => !b.disabled && inside(p, b)) || null;
  canvas.style.cursor = hovered ? 'pointer' : 'default';
});
canvas.addEventListener('click', e => {
  const b = buttons.find(b => !b.disabled && inside(mousePos(e), b));
  if (b) {
    sfx.click();
    b.action();
  }
});

// ---- Screens ----
function setScreen(name) {
  screen = name;
  hovered = null;
  canvas.style.cursor = 'default';
  if (name === 'menu') {
    buttons = [
      { x: W / 2 - 210, y: 245, w: 420, h: 56, label: 'Play', primary: true, size: 22, action: () => startLevel(unlockedLevel) },
      { x: W / 2 - 210, y: 315, w: 420, h: 52, label: 'Level Select', primary: false, size: 18, action: () => setScreen('levels') },
      { x: W / 2 - 210, y: 380, w: 420, h: 52, label: 'Characters', primary: false, size: 18, action: () => setScreen('select') },
      { x: W - 190, y: 20, w: 170, h: 36, label: () => crtEnabled ? 'CRT: ON' : 'CRT: OFF', size: 12, action: () => { crtEnabled = !crtEnabled; } },
      { x: W - 190, y: 64, w: 170, h: 36, label: () => muted ? 'SFX: OFF' : 'SFX: ON', size: 12, action: () => { muted = !muted; } }
    ];
  } else if (name === 'select') {
    const cardW = 195, gap = 22;
    const totalW = CHARACTERS.length * cardW + (CHARACTERS.length - 1) * gap;
    const startX = (W - totalW) / 2;
    buttons = CHARACTERS.map((c, i) => ({
      x: startX + i * (cardW + gap), y: 105, w: cardW, h: 280, card: true, index: i,
      action: () => { selected = i; }
    }));
    buttons.push({ x: 30, y: 26, w: 130, h: 44, label: 'Back', size: 14, action: () => setScreen('menu') });
    buttons.push({ x: W / 2 - 140, y: 425, w: 280, h: 56, label: 'Confirm', primary: true, size: 22, action: () => setScreen('menu') });
  } else if (name === 'levels') {
    const perPage = 6;
    const maxPages = Math.ceil(LEVELS.length / perPage);
    buttons = [
      { x: 30, y: 26, w: 130, h: 44, label: 'Back', size: 14, action: () => setScreen('menu') }
    ];
    const cols = 3, rows = 2;
    const boxW = 260, boxH = 140, gapX = 30, gapY = 28;
    const gridW = cols * boxW + (cols - 1) * gapX;
    const startX = (W - gridW) / 2;
    const startY = 115;

    for (let i = 0; i < perPage; i++) {
      const idx = levelSelectPage * perPage + i;
      if (idx >= LEVELS.length) break;
      const col = i % cols;
      const row = Math.floor(i / cols);
      const locked = idx > unlockedLevel;
      buttons.push({
        x: startX + col * (boxW + gapX),
        y: startY + row * (boxH + gapY),
        w: boxW, h: boxH,
        levelCard: true,
        levelIdx: idx,
        disabled: locked,
        action: () => startLevel(idx)
      });
    }

    if (levelSelectPage > 0) {
      buttons.push({ x: W / 2 - 220, y: 445, w: 180, h: 48, label: '< Prev', size: 14, action: () => { levelSelectPage--; setScreen('levels'); } });
    }
    if (levelSelectPage < maxPages - 1) {
      buttons.push({ x: W / 2 + 40, y: 445, w: 180, h: 48, label: 'Next >', size: 14, action: () => { levelSelectPage++; setScreen('levels'); } });
    }
  } else if (name === 'win') {
    buttons = [
      { x: W / 2 - 210, y: 340, w: 420, h: 56, label: currentLevelIdx + 1 < LEVELS.length ? 'Next Stage' : 'All Clear!', primary: true, size: 20, action: () => {
        if (currentLevelIdx + 1 < LEVELS.length) startLevel(currentLevelIdx + 1);
        else setScreen('levels');
      }},
      { x: W / 2 - 210, y: 410, w: 200, h: 48, label: 'Replay', size: 14, action: () => startLevel(currentLevelIdx) },
      { x: W / 2 + 10, y: 410, w: 200, h: 48, label: 'Stages', size: 14, action: () => setScreen('levels') }
    ];
  } else {
    buttons = [];
  }
}

// ---- Level Loader & Physics ----
const BASE_GRAVITY = 1800;

function startLevel(idx) {
  currentLevelIdx = idx;
  level = LEVELS[idx];
  platforms = level.platforms.map(([x, y, w, h]) => ({ x, y, w, h }));
  movers = level.movers.map(([x, y, w, h, dx, dy, speed]) => ({
    startX: x, startY: y, x, y, w, h, dx, dy, speed, phase: 0, vx: 0, vy: 0
  }));
  spikes = level.spikes.map(([x, y, count]) => ({ x, y, w: count * 16, h: 16, count }));
  springs = level.springs.map(([x, y]) => ({ x, y, w: 28, h: 16, bounceTimer: 0 }));
  coins = level.coins.map(([x, y]) => ({ x, y, r: 9, collected: false, bob: x * 0.05 }));
  goal = { x: level.goal[0], y: level.goal[1], w: 28, h: 84 };

  particles = [];
  levelTime = 0;
  coinsCollected = 0;
  deaths = 0;
  respawnPlayer(true);
  setScreen('play');
}

function respawnPlayer(silent = false) {
  const c = CHARACTERS[selected];
  player = {
    ...c,
    x: level.spawn[0],
    y: level.spawn[1] - c.h,
    vx: 0, vy: 0,
    onGround: false,
    jumpsLeft: c.doubleJump ? 2 : 1,
    coyoteTimer: 0,
    face: 1,
    phase: 0,
    t: 0,
    trail: []
  };
  camX = Math.max(0, Math.min(level.width - W, player.x - W * 0.35));
  if (!silent) {
    sfx.hurt();
    shakeTime = 0.22;
    deaths++;
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff4d4d', 18, 220);
  }
}

function spawnParticles(x, y, color, count, speed = 120) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = (0.3 + Math.random() * 0.7) * speed;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 40,
      life: 0.25 + Math.random() * 0.25,
      maxLife: 0.5,
      size: 3 + Math.floor(Math.random() * 4),
      color
    });
  }
}

function tryJump() {
  if (!player) return;
  if (player.onGround || player.coyoteTimer > 0) {
    player.vy = -player.jump;
    player.onGround = false;
    player.coyoteTimer = 0;
    player.jumpsLeft = player.doubleJump ? 1 : 0;
    sfx.jump();
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#ffffff', 7, 90);
  } else if (player.jumpsLeft > 0) {
    player.vy = -player.jump * 0.92;
    player.jumpsLeft--;
    sfx.djump();
    spawnParticles(player.x + player.w / 2, player.y + player.h, player.accent, 12, 130);
  }
}

function hit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(dt) {
  globalTime += dt;
  if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - dt);

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 450 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (screen !== 'play') return;
  levelTime += dt;

  // Update moving platforms
  for (const m of movers) {
    const prevX = m.x, prevY = m.y;
    m.phase += dt * m.speed;
    const t = (Math.sin(m.phase - Math.PI / 2) + 1) / 2;
    m.x = m.startX + m.dx * t;
    m.y = m.startY + m.dy * t;
    m.vx = (m.x - prevX) / dt;
    m.vy = (m.y - prevY) / dt;
  }

  // Update springs
  for (const s of springs) {
    if (s.bounceTimer > 0) s.bounceTimer = Math.max(0, s.bounceTimer - dt);
  }

  // Player horizontal movement
  const dir = (right() ? 1 : 0) - (left() ? 1 : 0);
  if (dir !== 0) {
    const accel = (player.vx === 0 || Math.sign(player.vx) === dir) ? 1450 : 2800;
    player.vx = Math.max(-player.speed, Math.min(player.speed, player.vx + dir * accel * dt));
    player.face = dir;
  } else {
    const slow = (player.onGround ? 2200 : 500) * dt;
    player.vx = Math.abs(player.vx) <= slow ? 0 : player.vx - Math.sign(player.vx) * slow;
  }

  // Variable jump height when releasing jump early
  if (!jumpHeld() && player.vy < -220) {
    player.vy += BASE_GRAVITY * 1.4 * dt;
  }

  player.vy += BASE_GRAVITY * player.gravityScale * dt;

  // All solid surfaces
  const solids = [...platforms, ...movers];

  // Move X
  player.x += player.vx * dt;
  for (const p of solids) {
    if (hit(player, p)) {
      player.x = player.vx > 0 ? p.x - player.w : p.x + p.w;
      player.vx = 0;
    }
  }
  player.x = Math.max(0, Math.min(level.width - player.w, player.x));

  // Move Y
  const wasOnGround = player.onGround;
  player.y += player.vy * dt;
  player.onGround = false;
  let ridingMover = null;

  for (const p of solids) {
    if (hit(player, p)) {
      if (player.vy >= 0) {
        if (!wasOnGround && player.vy > 280) {
          spawnParticles(player.x + player.w / 2, p.y, '#e2e8f0', 6, 70);
        }
        player.y = p.y - player.h;
        player.onGround = true;
        player.jumpsLeft = player.doubleJump ? 2 : 1;
        if (p.vx !== undefined) ridingMover = p;
      } else {
        player.y = p.y + p.h;
      }
      player.vy = 0;
    }
  }

  // Carry player with moving platform
  if (ridingMover) {
    player.x += ridingMover.vx * dt;
    player.x = Math.max(0, Math.min(level.width - player.w, player.x));
  }

  // Coyote time
  if (player.onGround) player.coyoteTimer = 0.09;
  else player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);

  // Check Springs
  for (const s of springs) {
    if (hit(player, s)) {
      player.vy = -960;
      player.onGround = false;
      player.jumpsLeft = player.doubleJump ? 2 : 1;
      s.bounceTimer = 0.25;
      sfx.spring();
      spawnParticles(s.x + s.w / 2, s.y, '#ffd23f', 12, 160);
    }
  }

  // Check Coins
  for (const c of coins) {
    c.bob += dt * 4;
    if (!c.collected) {
      const coinBox = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (hit(player, coinBox)) {
        c.collected = true;
        coinsCollected++;
        sfx.coin();
        spawnParticles(c.x, c.y, '#ffd23f', 10, 120);
      }
    }
  }

  // Check Spikes or Pitfall
  for (const sp of spikes) {
    const hurtBox = { x: sp.x + 3, y: sp.y + 4, w: sp.w - 6, h: sp.h - 4 };
    if (hit(player, hurtBox)) {
      respawnPlayer(false);
      return;
    }
  }
  if (player.y > H + 120) {
    respawnPlayer(false);
    return;
  }

  // Check Goal Flag
  if (hit(player, goal)) {
    sfx.win();
    spawnParticles(goal.x + 14, goal.y + 20, '#ffd23f', 30, 260);
    if (currentLevelIdx + 1 > unlockedLevel && currentLevelIdx + 1 < LEVELS.length) {
      unlockedLevel = currentLevelIdx + 1;
    }
    const prevBest = bestTimes[currentLevelIdx];
    if (!prevBest || levelTime < prevBest) bestTimes[currentLevelIdx] = levelTime;
    const prevCoins = bestCoins[currentLevelIdx] || 0;
    if (coinsCollected > prevCoins) bestCoins[currentLevelIdx] = coinsCollected;
    saveProgress();
    setScreen('win');
    return;
  }

  // Animation & Speed Trail
  player.t += dt;
  if (player.onGround && Math.abs(player.vx) > 5) {
    player.phase += dt * (7 + Math.abs(player.vx) * 0.03);
  }
  if (Math.abs(player.vx) > 410 || !player.onGround) {
    if (Math.floor(player.t * 60) % 2 === 0) {
      player.trail.push({ x: player.x, y: player.y, face: player.face, alpha: 0.45 });
    }
  }
  for (let i = player.trail.length - 1; i >= 0; i--) {
    player.trail[i].alpha -= dt * 2.4;
    if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
  }

  // Smooth Camera Follow
  const targetCam = player.x + player.w / 2 - W * 0.38;
  const clampedCam = Math.max(0, Math.min(level.width - W, targetCam));
  camX += (clampedCam - camX) * Math.min(1, dt * 10);
}

// ---- Drawing Helpers ----
function outlined(str, x, y, size, fill, line = 5, align = 'center') {
  ctx.font = `${size}px ${PIXEL_FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = line;
  ctx.strokeStyle = '#000';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}

function drawButton(b) {
  if (b.card || b.levelCard) return;
  const hot = hovered === b;
  const label = typeof b.label === 'function' ? b.label() : b.label;
  ctx.fillStyle = '#000';
  ctx.fillRect(b.x + 4, b.y + 4, b.w, b.h);

  if (b.primary) ctx.fillStyle = hot ? '#ffe869' : '#ffd23f';
  else ctx.fillStyle = hot ? '#ffffff' : '#d8e0ef';
  ctx.fillRect(b.x, b.y, b.w, b.h);

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4;
  ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
  outlined(label.toUpperCase(), b.x + b.w / 2, b.y + b.h / 2 + 2, b.size || 20, '#fff', 4);
}

// Upgraded Character Renderer with unique accessories per character
function drawChar(c, x, y, scale = 1, face = 1, pose = {}, alpha = 1) {
  const SKIN = c.skin, SKIN_DARK = c.skinDark, SHIRT = c.shirt;
  const PANTS = c.pants, PANTS_DARK = c.pantsDark, INK = '#1b1b1b';
  const lerp = (a, b, t) => a + (b - a) * t;
  const speed = pose.speed || 0;
  const move = Math.min(1, speed / 60);
  const sprint = Math.max(0, Math.min(1, (speed - 180) / 150));
  const sn = Math.sin(pose.phase || 0);
  const LEG = c.sprite === 'tank' ? 17 : 16;
  const ARM = c.sprite === 'tank' ? 15 : 14;

  let leg, arm, lean;
  if (pose.air) {
    const sway = Math.sin((pose.t || 0) * 12) * 0.1;
    leg = [0.7, -0.5];
    arm = [-2.1 + sway, -1.8 - sway];
    lean = 0.08 + sprint * 0.2;
  } else {
    const A = lerp(0.55, 0.92, sprint) * move;
    const AA = lerp(0.5, 1.05, sprint) * move;
    leg = [A * sn, -A * sn];
    arm = [-AA * sn, AA * sn];
    lean = lerp(0.04, 0.4, sprint) * move;
  }
  const breathe = (pose.air || move > 0) ? 0 : Math.sin((pose.t || 0) * 2.5) * 0.4;
  const hipY = -(pose.air ? LEG : Math.max(LEG * Math.cos(leg[0]), LEG * Math.cos(leg[1])));

  const limb = (px, py, a, len, w, fill) => {
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(-a);
    ctx.fillStyle = fill;
    ctx.fillRect(-w / 2, 0, w, len);
    ctx.beginPath();
    ctx.arc(0, 0, w / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };
  const upper = fn => { ctx.save(); ctx.translate(0, -breathe); ctx.rotate(lean); fn(); ctx.restore(); };

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x + c.w * scale / 2, y + c.h * scale);
  ctx.scale(face > 0 ? scale : -scale, scale);
  ctx.translate(0, hipY);

  const armW = c.sprite === 'tank' ? 6.5 : 5;
  const legW = c.sprite === 'tank' ? 7.5 : 6;
  const torsoW = c.sprite === 'tank' ? 14 : 10;

  // Far arm & legs
  upper(() => limb(0, -13, arm[1], ARM, armW, SKIN_DARK));
  limb(0, -1, leg[1], LEG, legW, PANTS_DARK);
  limb(0, -1, leg[0], LEG, legW, PANTS);

  // Torso & Head
  upper(() => {
    ctx.fillStyle = SHIRT;
    ctx.fillRect(-torsoW / 2, -16, torsoW, 16);

    // Character-specific torso details
    if (c.sprite === 'tank') {
      ctx.fillStyle = '#52b788';
      ctx.fillRect(-torsoW / 2, -16, torsoW, 5);
    } else if (c.sprite === 'aero') {
      // Scarf tail
      ctx.fillStyle = '#fff';
      ctx.fillRect(-torsoW / 2 - 2, -16, torsoW + 3, 4);
      const wave = Math.sin((pose.t || 0) * 10) * 2;
      ctx.fillRect(-torsoW / 2 - 7, -15 + wave, 6, 3);
    }

    // Head
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(-3.5, -28);
    ctx.arcTo(6, -28, 6, -16, 2.5);
    ctx.arcTo(6, -16, -6, -16, 2.5);
    ctx.arcTo(-6, -16, -6, -28, 2.5);
    ctx.arcTo(-6, -28, 6, -28, 2.5);
    ctx.closePath();
    ctx.fill();

    // Eyes & Mouth
    ctx.fillStyle = INK;
    ctx.fillRect(2.6, -23.6, 1.8, 2.6);
    ctx.fillRect(1.8, -19.4, 3.6, 1);

    // Character-specific Headgear
    if (c.sprite === 'blaze') {
      // Spiky headband + flame hair
      ctx.fillStyle = '#d00000';
      ctx.fillRect(-6.5, -26, 13, 3);
      ctx.fillStyle = '#ffaa00';
      ctx.beginPath();
      ctx.moveTo(-6, -26); ctx.lineTo(-9, -32); ctx.lineTo(-2, -28);
      ctx.lineTo(1, -34); ctx.lineTo(4, -28); ctx.closePath(); ctx.fill();
    } else if (c.sprite === 'aero') {
      // Aviator goggles on forehead
      ctx.fillStyle = '#03045e';
      ctx.fillRect(-6.5, -27.5, 13, 3.5);
      ctx.fillStyle = '#90e0ef';
      ctx.fillRect(1, -27, 4.5, 2.5);
    } else if (c.sprite === 'tank') {
      // Retro Helmet
      ctx.fillStyle = '#2b9348';
      ctx.fillRect(-6.8, -29.5, 13.6, 5);
      ctx.fillStyle = '#000';
      ctx.fillRect(-6.8, -25.5, 13.6, 1.5);
    }
  });

  // Near arm
  upper(() => limb(0, -13, arm[0], ARM, armW, SKIN));
  ctx.restore();
}

// ---- World Drawing ----
function drawParallaxBackground(theme) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, theme.skyTop);
  grad.addColorStop(1, theme.skyBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars for night theme
  if (theme.stars) {
    for (let i = 0; i < 45; i++) {
      const sx = ((i * 197) % W);
      const sy = ((i * 89) % 260) + 20;
      const blink = Math.sin(globalTime * 3 + i) > 0.2 ? 3 : 2;
      ctx.fillStyle = i % 3 === 0 ? '#90e0ef' : '#ffffff';
      ctx.fillRect(sx, sy, blink, blink);
    }
  }

  // Retro Sun / Moon
  ctx.fillStyle = theme.stars ? '#f8f9fa' : (theme === THEMES.volcano ? '#ff5400' : '#ffe66d');
  ctx.beginPath();
  ctx.arc(760 - camX * 0.03, 110, 38, 0, Math.PI * 2);
  ctx.fill();

  // Clouds
  if (theme.clouds) {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (let i = 0; i < 8; i++) {
      const cx = ((i * 340 - camX * 0.15) % (W + 200) + (W + 200)) % (W + 200) - 100;
      const cy = 60 + (i % 3) * 45;
      ctx.fillRect(cx, cy, 72, 18);
      ctx.fillRect(cx + 14, cy - 10, 44, 12);
    }
  }

  // Far Mountains / Hills (Parallax 0.25)
  ctx.fillStyle = theme.hill1;
  for (let i = -1; i < 12; i++) {
    const hx = i * 240 - ((camX * 0.25) % 240);
    ctx.beginPath();
    ctx.moveTo(hx, H);
    ctx.lineTo(hx + 120, 250 + (Math.abs(i) % 2) * 40);
    ctx.lineTo(hx + 240, H);
    ctx.closePath();
    ctx.fill();
  }

  // Near Hills (Parallax 0.45)
  ctx.fillStyle = theme.hill2;
  for (let i = -1; i < 14; i++) {
    const hx = i * 190 - ((camX * 0.45) % 190);
    ctx.beginPath();
    ctx.moveTo(hx, H);
    ctx.lineTo(hx + 95, 330 + (Math.abs(i) % 3) * 25);
    ctx.lineTo(hx + 190, H);
    ctx.closePath();
    ctx.fill();
  }
}

function drawTerrain(p, theme, isMover = false) {
  if (p.x + p.w < camX - 40 || p.x > camX + W + 40) return;

  if (isMover) {
    ctx.fillStyle = '#3d405b';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(p.x, p.y, p.w, 6);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeRect(p.x + 1.5, p.y + 1.5, p.w - 3, p.h - 3);
    // Bolts
    ctx.fillStyle = '#e0e1dd';
    ctx.fillRect(p.x + 6, p.y + 10, 4, 4);
    ctx.fillRect(p.x + p.w - 10, p.y + 10, 4, 4);
    return;
  }

  const GRASS = 12;
  ctx.fillStyle = theme.dirt;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  for (let ty = p.y + GRASS; ty < p.y + p.h; ty += 16) {
    for (let tx = p.x; tx < p.x + p.w; tx += 16) {
      const r = (Math.imul(tx * 7 + 13, 2654435761) ^ Math.imul(ty * 13 + 7, 40503)) >>> 0;
      if (r % 5 === 0) {
        ctx.fillStyle = theme.dirtDark;
        ctx.fillRect(tx + (r >>> 3) % 8, ty + (r >>> 7) % 8, 6, 4);
      }
    }
  }
  ctx.fillStyle = theme.grass;
  ctx.fillRect(p.x, p.y, p.w, GRASS);
  ctx.fillStyle = theme.grassDark;
  ctx.fillRect(p.x, p.y + GRASS - 4, p.w, 4);
  for (let tx = p.x; tx < p.x + p.w; tx += 8) {
    const r = (Math.imul(tx * 11 + 5, 2654435761) >>> 0);
    if (r % 3 === 0) { ctx.fillStyle = theme.grassDark; ctx.fillRect(tx, p.y + GRASS, 8, 4); }
    if (r % 4 === 1) { ctx.fillStyle = theme.grassLight; ctx.fillRect(tx, p.y + 2, 4, 4); }
  }
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.strokeRect(p.x + 1.5, p.y + 1.5, p.w - 3, p.h - 3);
}

function drawSpikes(sp) {
  if (sp.x + sp.w < camX - 40 || sp.x > camX + W + 40) return;
  for (let i = 0; i < sp.count; i++) {
    const sx = sp.x + i * 16;
    ctx.fillStyle = '#e5e5e5';
    ctx.beginPath();
    ctx.moveTo(sx, sp.y + 16);
    ctx.lineTo(sx + 8, sp.y);
    ctx.lineTo(sx + 16, sp.y + 16);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawSpring(s) {
  const squish = s.bounceTimer > 0 ? 6 : 0;
  ctx.fillStyle = '#adb5bd';
  ctx.fillRect(s.x + 6, s.y + 6 + squish, s.w - 12, 10 - squish);
  ctx.fillStyle = '#ff2a55';
  ctx.fillRect(s.x, s.y + squish, s.w, 7);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(s.x, s.y + squish, s.w, 7);
}

function drawCoin(c) {
  if (c.collected) return;
  const by = c.y + Math.sin(c.bob) * 4;
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(c.x, by, c.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.fillStyle = '#fff3b0';
  ctx.fillRect(c.x - 2, by - 4, 3, 8);
}

function drawGoal(g) {
  // Flagpole
  ctx.fillStyle = '#f8f9fa';
  ctx.fillRect(g.x + 11, g.y, 6, g.h);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeRect(g.x + 11, g.y, 6, g.h);

  // Base
  ctx.fillStyle = '#495057';
  ctx.fillRect(g.x + 4, g.y + g.h - 8, 20, 8);

  // Waving Checker Flag
  const wave = Math.sin(globalTime * 6) * 3;
  ctx.fillStyle = '#38b000';
  ctx.beginPath();
  ctx.moveTo(g.x + 17, g.y + 4);
  ctx.lineTo(g.x + 48, g.y + 14 + wave);
  ctx.lineTo(g.x + 17, g.y + 26);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Golden Finial Ball
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.arc(g.x + 14, g.y, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

// ---- Screen Rendering ----
function drawMenu() {
  drawParallaxBackground(THEMES.day);
  drawTerrain({ x: 0, y: 480, w: W, h: 60 }, THEMES.day);

  // Animated Demo Character running on the title screen
  const demoChar = CHARACTERS[selected];
  const demoX = ((globalTime * 160) % (W + 100)) - 50;
  drawChar(demoChar, demoX, 480 - demoChar.h, 1, 1, { speed: 240, air: false, phase: globalTime * 14, t: globalTime });

  // Title Banner
  outlined('RUSH TALE', W / 2, 115, 56, '#ff3b30', 7);
  outlined('RETRO ARCADE EDITION', W / 2, 172, 16, '#ffd23f', 4);

  // Selected Runner Badge
  outlined(`RUNNER: ${demoChar.name.toUpperCase()}`, W / 2, 212, 12, '#ffffff', 3);

  buttons.forEach(drawButton);

  outlined('ARROWS / WASD: MOVE & JUMP   R: RESTART', W / 2, 512, 11, '#ffffff', 3);
}

function drawSelect() {
  drawParallaxBackground(THEMES.night);
  outlined('SELECT YOUR RUNNER', W / 2, 52, 26, '#ffd23f', 5);

  buttons.filter(b => b.card).forEach(b => {
    const i = b.index;
    const c = CHARACTERS[i];
    const on = selected === i;
    const hot = hovered === b;

    ctx.fillStyle = '#000';
    ctx.fillRect(b.x + 5, b.y + 5, b.w, b.h);

    ctx.fillStyle = on ? '#2b3a67' : (hot ? '#222b4a' : '#181e36');
    ctx.fillRect(b.x, b.y, b.w, b.h);

    ctx.strokeStyle = on ? '#ffd23f' : '#ffffff';
    ctx.lineWidth = on ? 5 : 2;
    ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);

    // Live animated character preview
    const previewPose = on
      ? { speed: 220, air: false, phase: globalTime * 12, t: globalTime }
      : { speed: 0, air: false, phase: 0, t: globalTime };
    drawChar(c, b.x + b.w / 2 - (c.w * 1.6) / 2, b.y + 42, 1.6, 1, previewPose);

    outlined(c.name.toUpperCase(), b.x + b.w / 2, b.y + 140, 15, on ? '#ffd23f' : '#ffffff', 4);
    outlined(c.title.toUpperCase(), b.x + b.w / 2, b.y + 163, 9, c.accent, 3);

    // Stat Bars
    const statKeys = ['SPD', 'JMP', 'AIR'];
    statKeys.forEach((sk, si) => {
      const sy = b.y + 190 + si * 22;
      outlined(sk, b.x + 36, sy, 9, '#cbd5e1', 2);
      for (let pip = 0; pip < 5; pip++) {
        ctx.fillStyle = pip < c.stats[sk] ? c.accent : '#0f1322';
        ctx.fillRect(b.x + 68 + pip * 21, sy - 6, 17, 11);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x + 68 + pip * 21, sy - 6, 17, 11);
      }
    });

    if (c.doubleJump) {
      outlined('2X JUMP!', b.x + b.w / 2, b.y + 260, 10, '#70e000', 3);
    }
  });

  buttons.filter(b => !b.card).forEach(drawButton);
}

function drawLevels() {
  drawParallaxBackground(THEMES.sunset);
  outlined('SELECT STAGE', W / 2, 52, 28, '#ffd23f', 5);
  outlined(`UNLOCKED: ${unlockedLevel + 1} / ${LEVELS.length}`, W / 2, 86, 12, '#ffffff', 3);

  buttons.filter(b => b.levelCard).forEach(b => {
    const idx = b.levelIdx;
    const lv = LEVELS[idx];
    const locked = b.disabled;
    const hot = hovered === b;

    ctx.fillStyle = '#000';
    ctx.fillRect(b.x + 5, b.y + 5, b.w, b.h);

    ctx.fillStyle = locked ? '#1c1c24' : (hot ? '#323b5e' : '#212740');
    ctx.fillRect(b.x, b.y, b.w, b.h);

    ctx.strokeStyle = locked ? '#555' : (bestTimes[idx] ? '#70e000' : '#ffd23f');
    ctx.lineWidth = 3;
    ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);

    if (locked) {
      outlined(`STAGE ${idx + 1}`, b.x + b.w / 2, b.y + 50, 14, '#777', 3);
      outlined('LOCKED', b.x + b.w / 2, b.y + 85, 16, '#ff4d4d', 3);
    } else {
      outlined(lv.name.toUpperCase(), b.x + b.w / 2, b.y + 34, 11, '#ffd23f', 3);
      const tStr = bestTimes[idx] ? `BEST: ${bestTimes[idx].toFixed(1)}S` : 'NOT CLEARED';
      outlined(tStr, b.x + b.w / 2, b.y + 72, 10, bestTimes[idx] ? '#70e000' : '#cbd5e1', 3);
      const cGot = bestCoins[idx] || 0;
      outlined(`COINS: ${cGot}/${lv.coins.length}`, b.x + b.w / 2, b.y + 104, 10, '#ffe66d', 3);
    }
  });

  buttons.filter(b => !b.levelCard).forEach(drawButton);
}

function drawPlay() {
  const theme = THEMES[level.theme] || THEMES.day;

  ctx.save();
  if (shakeTime > 0) {
    const mag = shakeTime * 28;
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
  }

  drawParallaxBackground(theme);

  ctx.save();
  ctx.translate(-Math.floor(camX), 0);

  platforms.forEach(p => drawTerrain(p, theme, false));
  movers.forEach(m => drawTerrain(m, theme, true));
  spikes.forEach(drawSpikes);
  springs.forEach(drawSpring);
  coins.forEach(drawCoin);
  drawGoal(goal);

  // Speed Afterimages
  for (const tr of player.trail) {
    drawChar(player, tr.x, tr.y, 1, tr.face, { speed: Math.abs(player.vx), air: !player.onGround, phase: player.phase, t: player.t }, tr.alpha * 0.45);
  }

  // Player
  const pose = { speed: Math.abs(player.vx), air: !player.onGround, phase: player.phase, t: player.t };
  drawChar(player, player.x, player.y, 1, player.face, pose);

  // Particles
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }

  ctx.restore();
  ctx.restore();

  // Retro Arcade HUD Bar
  ctx.fillStyle = 'rgba(11, 13, 20, 0.78)';
  ctx.fillRect(0, 0, W, 42);
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(0, 40, W, 2);

  outlined(level.name.toUpperCase(), 16, 22, 12, '#ffffff', 3, 'left');
  outlined(`COINS ${coinsCollected}/${coins.length}`, W / 2 - 40, 22, 12, '#ffd23f', 3, 'center');
  outlined(`TIME ${levelTime.toFixed(1)}S`, W - 16, 22, 12, '#70e000', 3, 'right');

  // Progress bar along bottom of HUD
  const prog = Math.max(0, Math.min(1, player.x / goal.x));
  ctx.fillStyle = '#38b000';
  ctx.fillRect(0, 40, W * prog, 3);
}

function drawWin() {
  drawPlay();
  ctx.fillStyle = 'rgba(10, 12, 22, 0.82)';
  ctx.fillRect(0, 0, W, H);

  outlined('STAGE CLEAR!', W / 2, 115, 42, '#70e000', 6);
  outlined(level.name.toUpperCase(), W / 2, 168, 16, '#ffd23f', 4);

  outlined(`TIME: ${levelTime.toFixed(2)}S`, W / 2, 225, 16, '#ffffff', 4);
  outlined(`COINS: ${coinsCollected} / ${coins.length}`, W / 2, 262, 16, '#ffe66d', 4);
  outlined(`RETRIES: ${deaths}`, W / 2, 298, 14, '#cbd5e1', 3);

  buttons.forEach(drawButton);
}

function drawCRT() {
  if (!crtEnabled) return;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.14)';
  for (let y = 0; y < H; y += 4) {
    ctx.fillRect(0, y, W, 1.5);
  }
  // Subtle vignette
  const grad = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.65);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function draw() {
  if (screen === 'menu') drawMenu();
  else if (screen === 'select') drawSelect();
  else if (screen === 'levels') drawLevels();
  else if (screen === 'play') drawPlay();
  else if (screen === 'win') drawWin();
  drawCRT();
}

// ---- Loop (fixed timestep) ----
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

document.fonts.load('16px "Press Start 2P"');
setScreen('menu');
requestAnimationFrame(frame);
</script>
</body>
</html>
